name = "friday-token-worker"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# livekit-server-sdk signs JWTs using some Node built-ins; nodejs_compat enables them.
compatibility_flags = ["nodejs_compat"]

# Disable the auto-generated workers.dev domain — traffic goes through api.friday.feynmanpi.com only.
workers_dev = false
preview_urls = false

# Non-secret vars can go here. Secrets are set with `wrangler secret put` (see README).
# [vars]
# LIVEKIT_URL = "wss://your-project.livekit.cloud"
