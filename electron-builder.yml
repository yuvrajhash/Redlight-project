appId: com.yuvrajchoudhary.yuv
productName: YUV
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.*'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!recovered-out'
  - '!agent'
  - '!worker'
asarUnpack:
  - resources/**
  - node_modules/@nut-tree-fork/**
  - node_modules/@jimp/**
  - node_modules/uiohook-napi/**
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: YUV needs microphone access for voice conversation.
    NSScreenCaptureDescription: YUV needs screen recording to see your display.
  target:
    - dmg
linux:
  target:
    - AppImage
npmRebuild: false
publish:
  provider: github
  owner: yuvrajhash
  repo: Redlight-project
